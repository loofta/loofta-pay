document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<title>Loofta · Gacha Pack 3D<\u002Ftitle>\n<style>/* =========================================================================\n   oofta Pay · Design Tokens\n   Non-custodial crypto payment platform.\n   Sourced from: apps/frontend/tailwind.config.ts, apps/frontend/src/app/globals.css,\n                 apps/frontend/src/app/home/page.tsx\n   ========================================================================= */\n\n/* ---------- Fonts (Clash Display + Clash Grotesk — brand originals) ----------\n   Variable axis TTFs are authoritative; static weights are provided as well. */\n@font-face {\n  font-family: 'Clash Display';\n  src: url(\"4143b09f-0f31-4ec5-896f-cc19c58c30e6\") format('truetype-variations');\n  font-weight: 200 700;\n  font-display: swap;\n  font-style: normal;\n}\n@font-face {\n  font-family: 'Clash Display';\n  src: url(\"eeb8b3e1-ce36-41e4-a451-4dee83165f30\") format('truetype');\n  font-weight: 400;\n  font-display: swap;\n}\n@font-face {\n  font-family: 'Clash Display';\n  src: url(\"0928e364-09e5-42f1-8d4a-3aa64f3e2fcf\") format('truetype');\n  font-weight: 500;\n  font-display: swap;\n}\n@font-face {\n  font-family: 'Clash Display';\n  src: url(\"d299b407-3b70-4f00-b20d-7d939c80832c\") format('truetype');\n  font-weight: 600;\n  font-display: swap;\n}\n@font-face {\n  font-family: 'Clash Display';\n  src: url(\"3e48733c-ad27-4b66-9c4e-6f805ebbd450\") format('truetype');\n  font-weight: 700;\n  font-display: swap;\n}\n\n@font-face {\n  font-family: 'Clash Grotesk';\n  src: url(\"72d981d9-ea4b-4be0-a129-1f950f46e5c4\") format('truetype-variations');\n  font-weight: 200 700;\n  font-display: swap;\n  font-style: normal;\n}\n@font-face {\n  font-family: 'Clash Grotesk';\n  src: url(\"b1526dd6-a919-470f-a7f8-04b84aefa9a2\") format('truetype');\n  font-weight: 400;\n  font-display: swap;\n}\n@font-face {\n  font-family: 'Clash Grotesk';\n  src: url(\"7b38bae4-2235-468a-9eae-de6a7e323a27\") format('truetype');\n  font-weight: 500;\n  font-display: swap;\n}\n@font-face {\n  font-family: 'Clash Grotesk';\n  src: url(\"0d882d61-9da4-415d-8c8e-0e94389c8821\") format('truetype');\n  font-weight: 600;\n  font-display: swap;\n}\n@font-face {\n  font-family: 'Clash Grotesk';\n  src: url(\"493c9afe-3741-4558-9f90-8ea45fed1879\") format('truetype');\n  font-weight: 700;\n  font-display: swap;\n}\n\n:root {\n  /* ---------- Brand ---------- */\n  --brand-red:        #FF1301;  /* hero gradient start (landing)           */\n  --brand-red-alt:    #FF0F00;  /* primary button gradient start (in-app)  */\n  --brand-orange:     #FF4A26;  /* logo fill                                */\n  --brand-yellow:     #EAB308;  /* gradient end (tailwind yellow-500)       */\n  --brand-gradient:   linear-gradient(90deg, var(--brand-red) 0%, var(--brand-yellow) 100%);\n  --brand-gradient-d: linear-gradient(135deg, var(--brand-red) 0%, var(--brand-yellow) 100%);\n  --brand-gradient-v: linear-gradient(180deg, var(--brand-red-alt) 0%, var(--brand-yellow) 100%);\n\n  /* ---------- Marketing / dark surfaces ----------\n     Landing lives on near-black with translucent white glass panels. */\n  --bg-ink:           #0f0f12;  /* page background                           */\n  --bg-ink-soft:      #1a1a22;  /* raised chip / pill on dark                */\n  --surface-1:        rgba(255, 255, 255, 0.03);  /* glass card                */\n  --surface-2:        rgba(255, 255, 255, 0.04);  /* hero mock card            */\n  --surface-3:        rgba(255, 255, 255, 0.06);  /* hover state               */\n  --border-soft:      rgba(255, 255, 255, 0.10);\n  --border-softer:    rgba(255, 255, 255, 0.05);\n  --border-stronger:  rgba(255, 255, 255, 0.15);\n\n  /* Text on dark */\n  --fg-primary-d:     #FFFFFF;\n  --fg-secondary-d:   #94a3b8;  /* slate-400 — body copy                    */\n  --fg-tertiary-d:    #64748b;  /* slate-500 — labels                       */\n  --fg-quaternary-d:  #475569;  /* slate-600 — faint metadata               */\n\n  /* ---------- App / light surfaces (shadcn HSL tokens from globals.css) ---------- */\n  --background:         hsl(0 0% 100%);        /* paper white               */\n  --foreground:         hsl(20 14.3% 4.1%);    /* near-black ink            */\n  --card:               hsl(0 0% 100%);\n  --card-foreground:    hsl(20 14.3% 4.1%);\n  --popover:            hsl(0 0% 100%);\n  --popover-foreground: hsl(20 14.3% 4.1%);\n  --primary:            hsl(24.6 95% 53.1%);   /* warm orange              */\n  --primary-foreground: hsl(60 9.1% 97.8%);\n  --secondary:          hsl(60 4.8% 95.9%);\n  --secondary-foreground: hsl(24 9.8% 10%);\n  --muted:              hsl(60 4.8% 95.9%);\n  --muted-foreground:   hsl(25 5.3% 44.7%);\n  --accent:             hsl(60 4.8% 95.9%);\n  --accent-foreground:  hsl(24 9.8% 10%);\n  --destructive:        hsl(0 84.2% 60.2%);\n  --destructive-foreground: hsl(60 9.1% 97.8%);\n  --border:             hsl(20 5.9% 90%);\n  --input:              hsl(20 5.9% 90%);\n  --ring:               hsl(24.6 95% 53.1%);\n\n  /* Semantic status */\n  --status-success:     #34D399;  /* emerald-400 — \"Shielded\" / \"Sponsored\" */\n  --status-warn:        #F59E0B;\n  --status-danger:      #EF4444;\n\n  /* ---------- Radii ---------- */\n  --radius-xs: 4px;\n  --radius-sm: 6px;\n  --radius:   8px;    /* from globals: 0.5rem                                */\n  --radius-md: 12px;  /* inputs / secondary buttons                          */\n  --radius-lg: 16px;  /* rounded-2xl cards & pills                           */\n  --radius-xl: 24px;  /* rounded-3xl hero cards                              */\n  --radius-full: 9999px;\n\n  /* ---------- Shadows ---------- */\n  --shadow-brand-lg:  0 20px 60px -15px rgba(255, 15, 0, 0.45);\n  --shadow-brand-md:  0 20px 60px -15px rgba(255, 15, 0, 0.35);\n  --shadow-brand-sm:  0 4px 10px rgba(255, 15, 0, 0.25);\n  --shadow-card:      0 10px 30px -10px rgba(0, 0, 0, 0.35);\n  --shadow-2xl:       0 25px 50px -12px rgba(0, 0, 0, 0.25);\n\n  /* ---------- Spacing scale (tailwind-ish) ---------- */\n  --space-1: 4px;  --space-2: 8px;  --space-3: 12px; --space-4: 16px;\n  --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px;\n  --space-12: 48px; --space-16: 64px; --space-20: 80px; --space-28: 112px;\n\n  /* ---------- Motion ---------- */\n  --ease-brand: cubic-bezier(0.16, 1, 0.3, 1);  /* @kind other */ /* \"smooth\" — used across landing */\n  --ease-out:   cubic-bezier(0.22, 1, 0.36, 1);  /* @kind other */\n  --dur-fast:   150ms;  /* @kind other */\n  --dur-base:   300ms;  /* @kind other */\n  --dur-slow:   600ms;  /* @kind other */\n\n  /* ---------- Type families ---------- */\n  --font-display: 'Clash Display', ui-sans-serif, system-ui, sans-serif;\n  --font-body:    'Clash Grotesk', ui-sans-serif, system-ui, sans-serif;\n  --font-mono:    ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;\n}\n\n/* ----------- Semantic typography helpers ----------- */\n.font-display { font-family: var(--font-display); }\n.font-body    { font-family: var(--font-body); }\n.font-mono    { font-family: var(--font-mono); }\n\n.h-display   { font-family: var(--font-display); font-weight: 700; font-size: 8rem;   line-height: 0.92; letter-spacing: -0.02em; } /* hero */\n.h1          { font-family: var(--font-display); font-weight: 700; font-size: 4.5rem; line-height: 0.95; letter-spacing: -0.015em; }\n.h2          { font-family: var(--font-display); font-weight: 700; font-size: 3rem;   line-height: 1.0;  letter-spacing: -0.01em; }\n.h3          { font-family: var(--font-display); font-weight: 600; font-size: 1.75rem;line-height: 1.1; }\n.subtitle    { font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; line-height: 1.2; opacity: 0.5; } /* from globals.css */\n.body-lg     { font-family: var(--font-body);    font-weight: 400; font-size: 1.25rem;line-height: 1.6; }\n.body        { font-family: var(--font-body);    font-weight: 400; font-size: 1rem;   line-height: 1.6; }\n.body-sm     { font-family: var(--font-body);    font-weight: 400; font-size: 0.875rem;line-height: 1.5; }\n.eyebrow     { font-family: var(--font-body);    font-weight: 600; font-size: 0.75rem;line-height: 1;   letter-spacing: 0.18em; text-transform: uppercase; }\n.mono        { font-family: var(--font-mono);    font-weight: 500; font-size: 0.9em; }\n\n/* Gradient text shortcut — used heavily on landing */\n.text-gradient {\n  background: var(--brand-gradient);\n  -webkit-background-clip: text;\n  background-clip: text;\n  -webkit-text-fill-color: transparent;\n  color: transparent;\n}\n<\u002Fstyle>\n<script type=\"importmap\">\n{\"imports\":{\"three\":\"https://unpkg.com/three@0.160.0/build/three.module.js\",\"three/addons/\":\"https://unpkg.com/three@0.160.0/examples/jsm/\"}}\n<\u002Fscript>\n<style>\n  *{box-sizing:border-box;margin:0;padding:0}\n  body{background:#0B0B0F;font-family:'Clash Grotesk',sans-serif;color:#fff;height:100vh;overflow:hidden}\n  #app{position:fixed;inset:0}\n  canvas{display:block}\n  .ui{position:fixed;left:0;right:0;bottom:20px;text-align:center;pointer-events:none;z-index:5}\n  .lbl{font-family:'Clash Display',sans-serif;font-weight:500;font-size:clamp(24px,3.4vw,34px);letter-spacing:-.02em;text-shadow:0 4px 30px rgba(0,0,0,.7)}\n  .sub{font-size:16px;color:#9a9791;margin-top:6px}\n  .win{background:linear-gradient(90deg,#E8B23A,#FFE9A8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}\n  .btn{pointer-events:auto;font-family:'Clash Display',sans-serif;font-weight:500;font-size:17px;padding:15px 32px;border:none;border-radius:999px;cursor:pointer;background:linear-gradient(90deg,#E8B23A,#FFE9A8);color:#0B0B0F;margin-top:14px;visibility:hidden}\n  .hint{position:fixed;top:22px;left:0;right:0;text-align:center;font-size:14px;color:#6f6c66;letter-spacing:.14em;text-transform:uppercase;z-index:5;pointer-events:none}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div id=\"app\"><\u002Fdiv>\n<div class=\"hint\" id=\"hint\">drag to orbit · click the pack to open<\u002Fdiv>\n<div class=\"ui\">\n  <div class=\"lbl\" id=\"lbl\">Click the pack to open<\u002Fdiv>\n  <div class=\"sub\" id=\"sub\">Every 1 USDC sent earns a pack<\u002Fdiv>\n  <button class=\"btn\" id=\"btn\">Open another<\u002Fbutton>\n<\u002Fdiv>\n\n<script type=\"module\">\nimport * as THREE from 'three';\nimport { OrbitControls } from 'three/addons/controls/OrbitControls.js';\nimport { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';\n// gacha-art.js — Loofta Gacha Pack artwork.\n// Classic white/black/gold gacha booster layout, Loofta brand, pokéball medallion.\n// Single source of truth: the preview page and the React component both draw from here.\n\nconst AW = 760;\nconst AH = 1120;\n\nconst RED = '#FF1301';\nconst ORG = '#FF6A00';\nconst YEL = '#EAB308';\nconst GOLD_L = '#FFE9A8';\nconst GOLD_M = '#E8B23A';\nconst GOLD_D = '#9A6B12';\nconst INK = '#0B0B0F';\nconst PAPER = '#FFFDF7';\n\nfunction loadSvg(url) {\n  return fetch(url).then(r => r.text()).then(t => {\n    const uri = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(t)));\n    return new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = uri; });\n  }).catch(() => null);\n}\n\nfunction goldGrad(x, x0, y0, x1, y1) {\n  const g = x.createLinearGradient(x0, y0, x1, y1);\n  g.addColorStop(0, GOLD_D); g.addColorStop(0.22, GOLD_M); g.addColorStop(0.5, GOLD_L);\n  g.addColorStop(0.78, GOLD_M); g.addColorStop(1, GOLD_D);\n  return g;\n}\nfunction brandGrad(x, x0, y0, x1, y1) {\n  const g = x.createLinearGradient(x0, y0, x1, y1);\n  g.addColorStop(0, RED); g.addColorStop(0.55, ORG); g.addColorStop(1, YEL);\n  return g;\n}\nfunction star(x, cx, cy, r) {\n  x.beginPath();\n  for (let i = 0; i < 10; i++) {\n    const rad = i % 2 ? r * 0.44 : r;\n    const a = -Math.PI / 2 + (i * Math.PI) / 5;\n    const px = cx + Math.cos(a) * rad, py = cy + Math.sin(a) * rad;\n    i ? x.lineTo(px, py) : x.moveTo(px, py);\n  }\n  x.closePath();\n}\nfunction crimp(x, y, h, dir) {\n  x.save();\n  x.fillStyle = INK; x.globalAlpha = 0.9; x.fillRect(0, y, AW, h);\n  x.globalAlpha = 0.16; x.fillStyle = '#fff';\n  for (let i = 0; i < AW; i += 9) x.fillRect(i, y, 3, h);\n  x.globalAlpha = 0.9; x.fillStyle = INK;\n  const teeth = 30, tw = AW / teeth, base = dir > 0 ? y + h : y, tip = base + dir * 14;\n  x.beginPath(); x.moveTo(0, base);\n  for (let i = 0; i < teeth; i++) { x.lineTo(i * tw + tw / 2, tip); x.lineTo((i + 1) * tw, base); }\n  x.closePath(); x.fill();\n  x.restore();\n}\n\n/** Pokéball-style medallion: brand-gradient dome, cream base, black band, mystery button. */\nfunction medallion(x, cx, cy, r) {\n  x.save();\n  // outer gold bezel\n  x.beginPath(); x.arc(cx, cy, r, 0, 7);\n  x.fillStyle = goldGrad(x, cx - r, cy - r, cx + r, cy + r); x.fill();\n  x.lineWidth = 3; x.strokeStyle = GOLD_D; x.stroke();\n\n  const ri = r - 26;\n  // upper dome\n  x.save();\n  x.beginPath(); x.arc(cx, cy, ri, Math.PI, 0); x.closePath(); x.clip();\n  x.fillStyle = brandGrad(x, cx - ri, cy - ri, cx + ri, cy);\n  x.fillRect(cx - ri, cy - ri, ri * 2, ri);\n  x.globalAlpha = 0.28; x.fillStyle = '#fff';\n  x.beginPath(); x.ellipse(cx - ri * 0.3, cy - ri * 0.55, ri * 0.42, ri * 0.22, -0.5, 0, 7); x.fill();\n  x.restore();\n  // lower half\n  x.save();\n  x.beginPath(); x.arc(cx, cy, ri, 0, Math.PI); x.closePath(); x.clip();\n  const lg = x.createLinearGradient(0, cy, 0, cy + ri);\n  lg.addColorStop(0, '#FFFFFF'); lg.addColorStop(1, '#E4DFD3');\n  x.fillStyle = lg; x.fillRect(cx - ri, cy, ri * 2, ri);\n  x.restore();\n  // equator band\n  x.save();\n  x.beginPath(); x.arc(cx, cy, ri, 0, 7); x.clip();\n  x.fillStyle = INK; x.fillRect(cx - ri, cy - ri * 0.135, ri * 2, ri * 0.27);\n  x.fillStyle = goldGrad(x, cx - ri, 0, cx + ri, 0);\n  x.fillRect(cx - ri, cy - ri * 0.152, ri * 2, 4);\n  x.fillRect(cx - ri, cy + ri * 0.135, ri * 2, 4);\n  x.restore();\n  // mystery button\n  const br = r * 0.3;\n  x.beginPath(); x.arc(cx, cy, br + 12, 0, 7);\n  x.fillStyle = goldGrad(x, cx - br, cy - br, cx + br, cy + br); x.fill();\n  x.beginPath(); x.arc(cx, cy, br, 0, 7); x.fillStyle = PAPER; x.fill();\n  x.lineWidth = 3; x.strokeStyle = GOLD_D; x.stroke();\n  x.textAlign = 'center';\n  x.fillStyle = brandGrad(x, cx - br, cy - br, cx + br, cy + br);\n  x.font = `500 ${Math.round(br * 1.5)}px \"Clash Display\"`;\n  x.fillText('?', cx, cy + br * 0.53);\n  x.restore();\n}\n\n/**\n * Draw the pack onto a 2D context sized AW×AH.\n * imgs: { logoWhite, logoDark, megapotDark, megapotWhite } — HTMLImageElements or null.\n */\nfunction drawGachaPack(x, face = 'front', imgs = {}) {\n  const { logoWhite, logoDark, megapotDark, megapotWhite } = imgs;\n  x.clearRect(0, 0, AW, AH);\n\n  // pearl-white foil body\n  const base = x.createLinearGradient(0, 0, AW, AH);\n  base.addColorStop(0, '#FFFFFF'); base.addColorStop(0.44, '#F4F1E9');\n  base.addColorStop(0.7, '#FFFFFF'); base.addColorStop(1, '#E9E5DA');\n  x.fillStyle = base; x.fillRect(0, 0, AW, AH);\n  // diagonal sheen\n  x.save(); x.translate(AW / 2, AH / 2); x.rotate(-0.62); x.globalAlpha = 0.5;\n  const sh = x.createLinearGradient(-AW, 0, AW, 0);\n  sh.addColorStop(0, 'rgba(255,255,255,0)'); sh.addColorStop(0.5, 'rgba(255,255,255,.85)');\n  sh.addColorStop(1, 'rgba(255,255,255,0)');\n  x.fillStyle = sh; x.fillRect(-AW, -170, AW * 2, 340); x.restore();\n\n  // ---- black sweeps ----\n  x.fillStyle = INK;\n  x.beginPath();\n  x.moveTo(0, 0); x.lineTo(AW, 0); x.lineTo(AW, 132);\n  x.bezierCurveTo(AW * 0.64, 322, AW * 0.30, 292, 0, 196);\n  x.closePath(); x.fill();\n  x.beginPath();\n  x.moveTo(0, AH); x.lineTo(AW, AH); x.lineTo(AW, AH - 248);\n  x.bezierCurveTo(AW * 0.60, AH - 430, AW * 0.26, AH - 392, 0, AH - 286);\n  x.closePath(); x.fill();\n\n  // gold hairlines tracing the sweeps\n  x.lineWidth = 6; x.strokeStyle = goldGrad(x, 0, 0, AW, 0);\n  x.beginPath(); x.moveTo(AW, 152);\n  x.bezierCurveTo(AW * 0.64, 342, AW * 0.30, 312, 0, 216); x.stroke();\n  x.beginPath(); x.moveTo(AW, AH - 268);\n  x.bezierCurveTo(AW * 0.60, AH - 450, AW * 0.26, AH - 412, 0, AH - 306); x.stroke();\n\n  // arcs framing the medallion\n  const cx = AW / 2, cy = face === 'front' ? 556 : 470, r = face === 'front' ? 186 : 120;\n  x.lineWidth = 5; x.strokeStyle = goldGrad(x, cx - 330, 0, cx + 330, 0);\n  x.beginPath(); x.arc(cx, cy, r + 92, 2.55, 3.95); x.stroke();\n  x.beginPath(); x.arc(cx, cy, r + 92, -0.6, 0.8); x.stroke();\n  x.globalAlpha = 0.5;\n  x.beginPath(); x.arc(cx, cy, r + 118, 2.7, 3.8); x.stroke();\n  x.beginPath(); x.arc(cx, cy, r + 118, -0.45, 0.65); x.stroke();\n  x.globalAlpha = 1;\n\n  // ---- brand marks ----\n  x.textAlign = 'center';\n  if (logoWhite) {\n    const w = 300, h = w * logoWhite.height / logoWhite.width;\n    x.drawImage(logoWhite, (AW - w) / 2, 126, w, h);\n  }\n\n  medallion(x, cx, cy, r);\n\n  if (face === 'front') {\n    // five gold stars\n    const sy = 826, gap = 96;\n    for (let i = 0; i < 5; i++) {\n      const sx = AW / 2 + (i - 2) * gap;\n      x.save();\n      x.shadowColor = 'rgba(154,107,18,.45)'; x.shadowBlur = 10; x.shadowOffsetY = 3;\n      star(x, sx, sy, 34);\n      x.fillStyle = goldGrad(x, sx - 34, sy - 34, sx + 34, sy + 34); x.fill();\n      x.restore();\n      x.lineWidth = 2; x.strokeStyle = GOLD_D; star(x, sx, sy, 34); x.stroke();\n    }\n    // bottom lockup: GACHA | PACK\n    const ly = AH - 128;\n    x.font = '500 62px \"Clash Display\"';\n    const gw = x.measureText('GACHA').width;\n    const pad = 22, bw = gw + pad * 2, bx = AW / 2 - bw - 16;\n    x.beginPath();\n    if (x.roundRect) x.roundRect(bx, ly - 52, bw, 74, 10); else x.rect(bx, ly - 52, bw, 74);\n    x.fillStyle = goldGrad(x, bx, ly - 52, bx + bw, ly + 22); x.fill();\n    x.fillStyle = INK; x.textAlign = 'center';\n    x.fillText('GACHA', bx + bw / 2, ly);\n    x.textAlign = 'left';\n    x.fillStyle = '#fff'; x.fillText('PACK', AW / 2 + 4, ly);\n    // divider\n    x.fillStyle = goldGrad(x, 0, 0, 0, AH);\n    x.fillRect(AW / 2 - 10, ly - 46, 3, 62);\n  } else {\n    // back: brand mark + medallion only\n  }\n\n  // sealed edges\n  crimp(x, 0, 46, 1);\n  crimp(x, AH - 46, 46, -1);\n  // hang hole\n  x.save(); x.globalAlpha = 0.55; x.fillStyle = '#3A3A44';\n  x.beginPath(); x.ellipse(AW / 2, 74, 30, 13, 0, 0, 7); x.fill();\n  x.restore();\n}\n\n\nconst lbl=document.getElementById('lbl'), sub=document.getElementById('sub'),\n      btn=document.getElementById('btn'), hint=document.getElementById('hint');\n\n/* ---------------- renderer / scene ---------------- */\nconst app=document.getElementById('app');\nconst renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});\nrenderer.setPixelRatio(Math.min(devicePixelRatio,2));\nrenderer.setSize(innerWidth,innerHeight);\nrenderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;\nrenderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=.95;\napp.appendChild(renderer.domElement);\n\nconst scene=new THREE.Scene();\nconst camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);\ncamera.position.set(0,.4,10.6);\nconst controls=new OrbitControls(camera,renderer.domElement);\ncontrols.enableDamping=true; controls.enablePan=false;\ncontrols.minDistance=6.5; controls.maxDistance=16; controls.target.set(0,.5,0);\n\nconst pmrem=new THREE.PMREMGenerator(renderer);\nscene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;\nscene.add(new THREE.HemisphereLight(0xfff6e6,0x141014,.6));\nconst key=new THREE.DirectionalLight(0xfffaf0,2.6); key.position.set(1.6,6.2,2.6);\nkey.castShadow=true; key.shadow.mapSize.set(2048,2048); key.shadow.radius=5;\nkey.shadow.camera.near=1; key.shadow.camera.far=16; key.shadow.bias=-0.0012;\nkey.shadow.camera.left=-3.4; key.shadow.camera.right=3.4;\nkey.shadow.camera.top=4; key.shadow.camera.bottom=-4;\nkey.shadow.camera.updateProjectionMatrix(); scene.add(key);\nconst rim=new THREE.DirectionalLight(0xffcf7a,1.7); rim.position.set(-4.2,1.8,-3.2); scene.add(rim);\nconst glowLight=new THREE.PointLight(0xFFD98A,0,14); glowLight.position.set(0,.5,1.4); scene.add(glowLight);\n\nconst ground=new THREE.Mesh(new THREE.CircleGeometry(10,64),new THREE.ShadowMaterial({opacity:.26}));\nground.rotation.x=-Math.PI/2; ground.position.y=-1.42; ground.receiveShadow=true; scene.add(ground);\n\n/* ---------------- textures ---------------- */\nfunction cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}\nfunction tex(c){const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;}\n\nlet imgs={}, _full={};\nfunction fullArt(face){\n  if(!_full[face]){\n    const c=cv(AW,AH);\n    drawGachaPack(c.getContext('2d'),face,imgs);\n    _full[face]=c;\n  }\n  return _full[face];\n}\nfunction slice(face,part){\n  const c=cv(AW,AH/2), x=c.getContext('2d');\n  x.drawImage(fullArt(face),0,part==='top'?0:AH/2,AW,AH/2,0,0,AW,AH/2);\n  return tex(c);\n}\nfunction edgeTex(){\n  const c=cv(64,560),x=c.getContext('2d');\n  const g=x.createLinearGradient(0,0,64,0);\n  g.addColorStop(0,'#CFC9BA'); g.addColorStop(.45,'#FFFFFF'); g.addColorStop(1,'#D9D3C4');\n  x.fillStyle=g; x.fillRect(0,0,64,560);\n  return tex(c);\n}\nfunction tornTex(){\n  const c=cv(760,64),x=c.getContext('2d');\n  x.fillStyle='#B9B2A2'; x.fillRect(0,0,760,64);\n  x.fillStyle='#FFFDF7'; x.beginPath(); x.moveTo(0,64);\n  for(let i=0;i<=38;i++) x.lineTo(i*20,(i%2?18:44));\n  x.lineTo(760,64); x.closePath(); x.fill();\n  return tex(c);\n}\n// subtle foil creases\nfunction crinkle(){\n  const S=1024,c=cv(S,S),x=c.getContext('2d');\n  x.fillStyle='#808080'; x.fillRect(0,0,S,S);\n  for(let i=0;i<22;i++){\n    x.save(); x.translate(Math.random()*S,Math.random()*S); x.rotate((Math.random()-.5)*1.1);\n    const g=x.createLinearGradient(0,-26,0,26);\n    g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.42,'rgba(255,255,255,.7)');\n    g.addColorStop(.52,'rgba(0,0,0,.66)');g.addColorStop(1,'rgba(0,0,0,0)');\n    x.fillStyle=g; x.fillRect(-S,-26,S*2,52); x.restore();\n  }\n  for(let i=0;i<52;i++){\n    x.save(); x.translate(Math.random()*S,Math.random()*S); x.rotate(Math.random()*Math.PI);\n    const len=60+Math.random()*170;\n    const g=x.createLinearGradient(0,-9,0,9);\n    g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.45,'rgba(255,255,255,.5)');\n    g.addColorStop(.55,'rgba(0,0,0,.46)');g.addColorStop(1,'rgba(0,0,0,0)');\n    x.fillStyle=g; x.fillRect(-len/2,-9,len,18); x.restore();\n  }\n  return tex(c);\n}\n\n/* gacha entry ticket */\nfunction ticketTex(entries){\n  const W=560,H=1160,c=cv(W,H),x=c.getContext('2d');\n  x.fillStyle=PAPER; x.fillRect(0,0,W,H);\n  const gg=x.createLinearGradient(0,0,W,0);\n  gg.addColorStop(0,GOLD_D);gg.addColorStop(.3,GOLD_M);gg.addColorStop(.5,GOLD_L);gg.addColorStop(.7,GOLD_M);gg.addColorStop(1,GOLD_D);\n  x.fillStyle=gg; x.fillRect(0,0,W,22);\n  x.textAlign='center';\n  if(imgs.logoDark){const w=250,h=w*imgs.logoDark.height/imgs.logoDark.width; x.drawImage(imgs.logoDark,(W-w)/2,120,w,h);}\n  x.fillStyle=INK; x.font='500 340px \"Clash Display\"'; x.letterSpacing='-18px';\n  x.fillText(String(entries).padStart(2,'0'),W/2,590);\n  x.fillStyle=gg; x.fillRect(W/2-80,650,160,11);\n  x.fillStyle='#6B6B78'; x.font='600 27px \"Clash Grotesk\"'; x.letterSpacing='10px';\n  x.fillText(entries===1?'ENTRY':'ENTRIES',W/2,742);\n  x.strokeStyle='rgba(11,11,15,.2)'; x.lineWidth=4; x.setLineDash([12,15]);\n  x.beginPath(); x.moveTo(28,852); x.lineTo(W-28,852); x.stroke(); x.setLineDash([]);\n  x.fillStyle=INK; x.fillRect(0,852,W,H-852);\n  x.fillStyle=gg; x.font='500 94px \"Clash Display\"'; x.letterSpacing='-3px';\n  x.fillText('$1.1M',W/2,1040);\n  return tex(c);\n}\n\n/* ---------------- pouch geometry ---------------- */\nconst PW=2.32, PH=PW*AH/AW, PD=.4;\nfunction hash2(i,j){const s=Math.sin(i*127.1+j*311.7)*43758.5453;return s-Math.floor(s);}\nfunction vnoise(x,y){\n  const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j;\n  const sx=fx*fx*(3-2*fx), sy=fy*fy*(3-2*fy);\n  const a=hash2(i,j),b=hash2(i+1,j),c=hash2(i,j+1),d=hash2(i+1,j+1);\n  const t=a+(b-a)*sx;\n  return t+((c+(d-c)*sx)-t)*sy;\n}\n// pillow profile: bulges at the centre, pinches flat at the sealed edges\nfunction pouch(geo,part,amt=.006){\n  const p=geo.attributes.position, n=geo.attributes.normal;\n  const hy=PH/2, yOff=part==='top'?PH/4:-PH/4;\n  for(let i=0;i<p.count;i++){\n    const x=p.getX(i),y=p.getY(i),z=p.getZ(i);\n    const u=Math.min(1,Math.abs(x)/(PW/2));\n    const v=Math.min(1,Math.abs(y+yOff)/hy);\n    const prof=Math.max(.3,Math.pow((1-Math.pow(u,4))*(1-Math.pow(v,6)),.45));\n    const w=(vnoise(x*3.7+11.3,y*3.1+5.9)-.5)*2\n           +(vnoise(x*8.3-3.1,y*7.1+17.7)-.5)*1.1\n           +(vnoise(x*19.7+2.3,y*16.1-8.9)-.5)*.45;\n    const d=w*amt, seal=1-.055*Math.pow(v,6);\n    p.setXYZ(i,x*seal+n.getX(i)*d,y+n.getY(i)*d,z*prof+n.getZ(i)*d*1.7);\n  }\n  p.needsUpdate=true; geo.computeVertexNormals(); return geo;\n}\n\nconst crinkleT=crinkle(), edgeT=edgeTex(), tornT=tornTex();\nfunction foilMat(map){\n  return new THREE.MeshPhysicalMaterial({\n    map, metalness:.18, roughness:.16,\n    clearcoat:1, clearcoatRoughness:.06, envMapIntensity:1.25,\n    bumpMap:crinkleT, bumpScale:.07, side:THREE.FrontSide});\n}\n\nconst packRig=new THREE.Group(); packRig.position.y=.5; scene.add(packRig);\nconst packGroup=new THREE.Group(); packRig.add(packGroup);\n\nfunction makeHalf(part){\n  const hh=PH/2;\n  const geo=pouch(new THREE.BoxGeometry(PW,hh,PD,40,30,3),part);\n  const side=foilMat(edgeT);\n  const cut=new THREE.MeshPhysicalMaterial({map:tornT,metalness:.05,roughness:.7});\n  const mats=[side,side,\n    part==='top'?side:cut, part==='top'?cut:side,\n    foilMat(slice('front',part)), foilMat(slice('back',part))];\n  const m=new THREE.Mesh(geo,mats);\n  m.castShadow=true; m.receiveShadow=true;\n  m.position.y=part==='top'?hh/2:-hh/2;\n  return m;\n}\nlet topHalf,botHalf;\n\n/* ticket */\nconst ticketGroup=new THREE.Group(); ticketGroup.visible=false; scene.add(ticketGroup);\nconst frontMat=new THREE.MeshPhysicalMaterial({roughness:.5,metalness:.05,clearcoat:.4});\nconst backMat=new THREE.MeshPhysicalMaterial({color:0xF2EEE2,roughness:.6});\nconst paperEdge=new THREE.MeshStandardMaterial({color:0xEDE6D6,roughness:.85});\nconst ticket=new THREE.Mesh(new THREE.BoxGeometry(2.05,4.25,.045,2,2,1),\n  [paperEdge,paperEdge,paperEdge,paperEdge,frontMat,backMat]);\nticket.castShadow=true; ticketGroup.add(ticket);\n\n/* confetti */\nconst P=150, pGeo=new THREE.BufferGeometry();\nconst pPos=new Float32Array(P*3), pCol=new Float32Array(P*3), pVel=[];\nconst palette=[new THREE.Color(GOLD_M),new THREE.Color(GOLD_L),new THREE.Color('#ffffff'),new THREE.Color('#FF6A00')];\nfor(let i=0;i<P;i++){\n  const a=Math.random()*Math.PI*2, e=(Math.random()-.5)*1.5, s=.06+Math.random()*.13;\n  pVel.push(new THREE.Vector3(Math.cos(a)*s,Math.abs(Math.sin(e))*s*1.5+.05,Math.sin(a)*s));\n  const c=palette[i%palette.length]; pCol[i*3]=c.r;pCol[i*3+1]=c.g;pCol[i*3+2]=c.b;\n}\npGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));\npGeo.setAttribute('color',new THREE.BufferAttribute(pCol,3));\nconst parts=new THREE.Points(pGeo,new THREE.PointsMaterial({size:.1,vertexColors:true,transparent:true,depthWrite:false}));\nparts.visible=false; parts.position.y=.5; scene.add(parts);\n\n/* ---------------- interaction ---------------- */\nconst ODDS=[[1,.68],[5,.25],[10,.07]];\nfunction roll(){const r=Math.random();let a=0;for(const[v,p]of ODDS){a+=p;if(r<=a)return v;}return 1;}\nlet phase='idle', t0=0, entries=1;\nconst clock=new THREE.Clock();\nconst ray=new THREE.Raycaster(), ptr=new THREE.Vector2();\n\nrenderer.domElement.addEventListener('click',e=>{\n  if(phase!=='idle'||!topHalf)return;\n  ptr.x=(e.clientX/innerWidth)*2-1; ptr.y=-(e.clientY/innerHeight)*2+1;\n  ray.setFromCamera(ptr,camera);\n  if(ray.intersectObjects([topHalf,botHalf],true).length) start();\n});\nfunction start(){\n  entries=roll();\n  if(frontMat.map)frontMat.map.dispose();\n  frontMat.map=ticketTex(entries); frontMat.needsUpdate=true;\n  phase='shake'; t0=clock.getElapsedTime();\n  lbl.textContent='Opening…'; lbl.className='lbl'; sub.textContent='Good luck';\n  hint.textContent='drag to orbit';\n}\nbtn.addEventListener('click',()=>{\n  phase='idle'; btn.style.visibility='hidden';\n  ticketGroup.visible=false; parts.visible=false;\n  topHalf.position.set(0,PH/4,0); topHalf.rotation.set(0,0,0);\n  botHalf.position.set(0,-PH/4,0); botHalf.rotation.set(0,0,0);\n  [topHalf,botHalf].forEach(m=>m.material.forEach(mt=>{mt.opacity=1;mt.transparent=false;}));\n  packRig.visible=true; glowLight.intensity=0;\n  lbl.textContent='Click the pack to open'; lbl.className='lbl';\n  sub.textContent='Every 1 USDC sent earns a pack';\n  hint.textContent='drag to orbit · click the pack to open';\n});\n\nconst ease=t=>1-Math.pow(1-t,3);\nfunction tick(){\n  const t=clock.getElapsedTime(), e=t-t0;\n  if(phase==='idle'){\n    packGroup.position.y=Math.sin(t*1.3)*.12;\n    packGroup.rotation.y=Math.sin(t*.55)*.36;\n    packGroup.rotation.z=Math.sin(t*.8)*.03;\n  } else if(phase==='shake'){\n    const k=Math.min(e/1.2,1);\n    packGroup.position.x=(Math.random()-.5)*.13*k;\n    packGroup.position.y=(Math.random()-.5)*.1*k;\n    packGroup.rotation.z=(Math.random()-.5)*.13*k;\n    packGroup.rotation.y*=.93;\n    glowLight.intensity=k*60;\n    if(e>1.2){\n      phase='burst'; t0=t; parts.visible=true; ticketGroup.visible=true;\n      const p=parts.geometry.attributes.position;\n      for(let i=0;i<P;i++){p.array[i*3]=0;p.array[i*3+1]=0;p.array[i*3+2]=0;}\n      p.needsUpdate=true;\n    }\n  } else if(phase==='burst'||phase==='reveal'){\n    const k=Math.min(e/.85,1), q=ease(k);\n    topHalf.position.y=PH/4+q*3.1; topHalf.rotation.x=-q*1.5; topHalf.rotation.z=-q*.5;\n    botHalf.position.y=-PH/4-q*3.1; botHalf.rotation.x=q*1.5; botHalf.rotation.z=q*.5;\n    [topHalf,botHalf].forEach(m=>m.material.forEach(mt=>{mt.transparent=true;mt.opacity=1-q;}));\n    packGroup.position.set(0,0,0); packGroup.rotation.set(0,0,0);\n    const p=parts.geometry.attributes.position;\n    for(let i=0;i<P;i++){\n      p.array[i*3]+=pVel[i].x*.55; p.array[i*3+1]+=pVel[i].y*.55-e*.012; p.array[i*3+2]+=pVel[i].z*.55;\n    }\n    p.needsUpdate=true;\n    parts.material.opacity=Math.max(0,1-e/1.5);\n    const rk=Math.min(Math.max((e-.15)/1.15,0),1), rq=ease(rk);\n    ticketGroup.position.y=-1.2+rq*1.7;\n    ticketGroup.rotation.y=(1-rq)*Math.PI*2.4;\n    ticketGroup.scale.setScalar(.5+rq*.36);\n    glowLight.intensity=60*(1-k*.55);\n    if(k>=1&&phase==='burst') phase='reveal';\n    if(e>1.5&&phase==='reveal'){\n      phase='done'; packRig.visible=false; parts.visible=false;\n      lbl.innerHTML=`<span class=\"win\">${entries} free ${entries===1?'entry':'entries'}<\u002Fspan>`;\n      sub.textContent=\"Added to tonight's $1.1M draw\";\n      btn.style.visibility='visible';\n    }\n  } else if(phase==='done'){\n    ticketGroup.rotation.y=Math.sin(t*.7)*.42;\n    ticketGroup.position.y=.5+Math.sin(t*1.2)*.07;\n    glowLight.intensity=22+Math.sin(t*2)*4;\n  }\n  controls.update();\n  renderer.render(scene,camera);\n  requestAnimationFrame(tick);\n}\n\naddEventListener('resize',()=>{\n  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();\n  renderer.setSize(innerWidth,innerHeight);\n});\n\n(async()=>{\n  try{await document.fonts.ready;}catch(e){}\n  imgs.logoWhite=await loadSvg('../assets/logo/loofta_white.svg');\n  imgs.logoDark=await loadSvg('../assets/logo/loofta.svg');\n  _full={};                       // rebuild artwork now fonts + logos are ready\n  topHalf=makeHalf('top'); botHalf=makeHalf('bot');\n  packGroup.add(topHalf,botHalf);\n  frontMat.map=ticketTex(1); frontMat.needsUpdate=true;\n  tick();\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
