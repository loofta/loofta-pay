<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <radialGradient id="body" cx="36%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#FFD9B0"/>
      <stop offset="38%" stop-color="#FF8832"/>
      <stop offset="100%" stop-color="#C84200"/>
    </radialGradient>
    <radialGradient id="glow" cx="36%" cy="24%" r="44%">
      <stop offset="0%" stop-color="white" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="edge" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#8C2C00" stop-opacity="0.4"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#B03800" flood-opacity="0.30"/>
    </filter>
  </defs>
  <!-- Ground shadow -->
  <ellipse cx="60" cy="113" rx="30" ry="6" fill="#B03800" opacity="0.12"/>
  <!-- Main sphere -->
  <circle cx="60" cy="55" r="46" fill="url(#body)" filter="url(#sh)"/>
  <circle cx="60" cy="55" r="46" fill="url(#edge)"/>
  <circle cx="60" cy="55" r="46" fill="url(#glow)"/>
  <!-- Top arrow: pointing right -->
  <line x1="34" y1="44" x2="78" y2="44" stroke="white" stroke-width="6" stroke-linecap="round" stroke-opacity="0.95"/>
  <polyline points="68,34 79,44 68,54" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.95"/>
  <!-- Bottom arrow: pointing left -->
  <line x1="42" y1="66" x2="86" y2="66" stroke="white" stroke-width="6" stroke-linecap="round" stroke-opacity="0.95"/>
  <polyline points="52,56 41,66 52,76" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.95"/>
</svg>
