<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <radialGradient id="body" cx="36%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#FFD9B0"/>
      <stop offset="38%" stop-color="#FF8832"/>
      <stop offset="100%" stop-color="#C84200"/>
    </radialGradient>
    <radialGradient id="glow" cx="36%" cy="24%" r="44%">
      <stop offset="0%" stop-color="white" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="edge" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#8C2C00" stop-opacity="0.4"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#B03800" flood-opacity="0.30"/>
    </filter>
  </defs>
  <!-- Ground shadow -->
  <ellipse cx="60" cy="113" rx="30" ry="6" fill="#B03800" opacity="0.12"/>
  <!-- Main sphere -->
  <circle cx="60" cy="55" r="46" fill="url(#body)" filter="url(#sh)"/>
  <circle cx="60" cy="55" r="46" fill="url(#edge)"/>
  <circle cx="60" cy="55" r="46" fill="url(#glow)"/>
  <!-- Ticket outline: rounded rectangle -->
  <rect x="19" y="41" width="82" height="28" rx="5" stroke="white" stroke-width="4.5" fill="none" stroke-opacity="0.95"/>
  <!-- Perforation / tear line -->
  <line x1="59" y1="42" x2="59" y2="68" stroke="white" stroke-width="2" stroke-dasharray="3 2.5" stroke-opacity="0.60"/>
  <!-- Star in left half (centered at 39, 55) outer r=9.5 inner r=3.8 -->
  <polygon
    points="39,45.5 41.2,51.6 47.7,51.9 42.7,56.0 44.5,62.4 39,58.8 33.5,62.4 35.3,56.0 30.3,51.9 36.8,51.6"
    fill="white" fill-opacity="0.95"/>
  <!-- Number dots in right half -->
  <circle cx="70" cy="52" r="3.2" fill="white" fill-opacity="0.88"/>
  <circle cx="79" cy="52" r="3.2" fill="white" fill-opacity="0.88"/>
  <circle cx="88" cy="52" r="3.2" fill="white" fill-opacity="0.88"/>
  <!-- Thin bar below dots (bonus line) -->
  <rect x="70" y="59" width="22" height="2.5" rx="1.25" fill="white" fill-opacity="0.50"/>
</svg>
