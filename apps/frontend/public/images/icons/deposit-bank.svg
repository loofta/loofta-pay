<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="cardFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD096"/>
      <stop offset="50%" stop-color="#FF7C28"/>
      <stop offset="100%" stop-color="#CC4400"/>
    </linearGradient>
    <linearGradient id="cardDepth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D05800"/>
      <stop offset="100%" stop-color="#9A2C00"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.48"/>
      <stop offset="55%" stop-color="white" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#B03400" flood-opacity="0.30"/>
    </filter>
  </defs>
  <!-- Card depth / 3D side layer -->
  <rect x="22" y="55" width="84" height="48" rx="10" fill="url(#cardDepth)" opacity="0.65"/>
  <!-- Card main face -->
  <rect x="14" y="38" width="84" height="48" rx="10" fill="url(#cardFace)" filter="url(#sh)"/>
  <!-- Card shine (top half glow) -->
  <rect x="14" y="38" width="84" height="24" rx="10" fill="url(#shine)"/>
  <!-- Magnetic stripe band -->
  <rect x="14" y="55" width="84" height="10" fill="#7A2800" opacity="0.30"/>
  <!-- EMV Chip body -->
  <rect x="24" y="65" width="20" height="14" rx="3" fill="#FFCA80" opacity="0.80"/>
  <!-- Chip inner lines (contact pads) -->
  <line x1="24" y1="70" x2="44" y2="70" stroke="#CC8030" stroke-width="1.2" stroke-opacity="0.55"/>
  <line x1="24" y1="74" x2="44" y2="74" stroke="#CC8030" stroke-width="1.2" stroke-opacity="0.55"/>
  <line x1="31" y1="65" x2="31" y2="79" stroke="#CC8030" stroke-width="1.2" stroke-opacity="0.55"/>
  <line x1="37" y1="65" x2="37" y2="79" stroke="#CC8030" stroke-width="1.2" stroke-opacity="0.55"/>
  <!-- Card number dots (two groups) -->
  <circle cx="53" cy="74" r="2.5" fill="white" fill-opacity="0.68"/>
  <circle cx="60" cy="74" r="2.5" fill="white" fill-opacity="0.68"/>
  <circle cx="67" cy="74" r="2.5" fill="white" fill-opacity="0.68"/>
  <circle cx="74" cy="74" r="2.5" fill="white" fill-opacity="0.68"/>
  <circle cx="84" cy="74" r="2.5" fill="white" fill-opacity="0.68"/>
  <circle cx="91" cy="74" r="2.5" fill="white" fill-opacity="0.68"/>
  <!-- Contactless symbol (curved arcs) -->
  <path d="M81 47 Q87 53 81 59" stroke="white" stroke-width="2" stroke-linecap="round" fill="none" stroke-opacity="0.7"/>
  <path d="M85 44 Q94 53 85 62" stroke="white" stroke-width="2" stroke-linecap="round" fill="none" stroke-opacity="0.45"/>
</svg>
