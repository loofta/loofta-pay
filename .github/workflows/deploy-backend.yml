# Deploy backend to Railway when pushing to main.
# Secrets (required): RAILWAY_TOKEN (project token from Railway → Project → Settings → Tokens).
# Secrets (required when project has multiple services): RAILWAY_SERVICE_ID
#   - In Railway: open your backend service → Settings → copy Service ID, or use the service name (e.g. "backend").
#   - In GitHub: Settings → Secrets and variables → Actions → New repository secret → RAILWAY_SERVICE_ID.
name: Deploy Backend (Railway)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/backend/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch: # Allow manual run

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      # Use secret if set; otherwise "backend" (set RAILWAY_SERVICE_ID in repo secrets if your service has another name/ID)
      RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID || 'backend' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Railway
        run: railway up --service "$RAILWAY_SERVICE_ID" --detach
        working-directory: apps/backend
