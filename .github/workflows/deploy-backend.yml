# Deploy backend to Railway when pushing to main.
# Secrets: RAILWAY_TOKEN (project token from Railway → Project → Settings → Tokens).
# Optional: RAILWAY_SERVICE_ID (service ID if project has multiple services).
name: Deploy Backend (Railway)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/backend/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch: # Allow manual run

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Railway
        run: |
          if [ -n "${{ secrets.RAILWAY_SERVICE_ID }}" ]; then
            railway up --service "${{ secrets.RAILWAY_SERVICE_ID }}" --detach
          else
            railway up --detach
          fi
        working-directory: apps/backend
