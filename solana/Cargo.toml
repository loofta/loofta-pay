[workspace]
members = ["programs/*"]
resolver = "2"

# Solana's cargo-build-sbf uses Cargo 1.84 which doesn't support edition2024.
# Patch blake3 to 1.8.2 (edition 2021) from git; crates.io patch must use a different source.
[patch.crates-io]
blake3 = { git = "https://github.com/BLAKE3-team/BLAKE3", tag = "1.8.2" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[workspace.dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"
ephemeral-rollups-sdk = { version = "0.8.0", features = ["anchor", "access-control"] }
borsh = "^0.10"
num-derive = "^0.3"
num-traits = "^0.2"
serde = "^1.0"
serde_with = "^3.0"
solana-program = "2.2"
thiserror = "^1.0"
session-keys = "3.0.10"
